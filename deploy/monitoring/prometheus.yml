global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: support-api
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: [support-api:8000]
    http_headers:
      X-Api-Key:
        files: [/run/secrets/support_api_key]
