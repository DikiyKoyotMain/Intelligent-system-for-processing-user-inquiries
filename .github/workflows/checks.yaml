name: Проверки проекта
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Тесты и ноутбуки на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-validation.txt
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/check_project.py
      - run: python scripts/verify_review_notebooks.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: work/validation/
          retention-days: 14
  containers:
    name: Локальный HTTPS и параллельные запросы
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: docker build -t support-local-check .
      - run: python scripts/verify_local_deployment.py --image support-local-check --monitoring
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-deployment
          path: work/local_deployment/
          retention-days: 14
