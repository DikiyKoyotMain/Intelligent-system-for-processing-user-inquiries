services:
  support-api:
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      AGENT_MODEL: ${AGENT_MODEL:-qwen2.5:1.5b}
    depends_on:
      ollama:
        condition: service_healthy
  ollama:
    image: ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ./work/ollama/models:/root/.ollama/models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    mem_limit: 2g
    cpus: 2
